# HTTPS for the existing Golfera application; IP certificate renewed by systemd.
server {
    listen 443 ssl;
    server_name 154.40.47.111;
    ssl_certificate /etc/letsencrypt/live/gaoqiu-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaoqiu-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    # Recover browsers retaining the former domain-root -> IP 308.
    # index.html is intentional: redirecting to domain / would loop in those browsers.
    location = / {
        add_header Cache-Control "no-store" always;
        return 302 https://gaoqiu.yinchao1204.vip/index.html$is_args$args;
    }
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
        proxy_request_buffering on;
    }
}
server {
    listen 8088;
    server_name 154.40.47.111;
    location = / {
        add_header Cache-Control "no-store" always;
        return 302 https://gaoqiu.yinchao1204.vip/index.html$is_args$args;
    }
    location / {
        add_header Cache-Control "no-store" always;
        return 302 https://gaoqiu.yinchao1204.vip$request_uri;
    }
}
